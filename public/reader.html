<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nibras Library</title>
<meta name="theme-color" content="#05060c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="reader">
<div class="rbar">
  <a class="ibtn" href="/" id="home" aria-label="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h6a3 3 0 0 1 2 1v13a3 3 0 0 0-2-1H4zM20 5h-6a3 3 0 0 0-2 1v13a3 3 0 0 1 2-1h6z"/></svg><span class="lbl" id="homeLbl"></span></a>
  <button class="ibtn" id="fdown" aria-label="A-">A−</button>
  <button class="ibtn" id="fup" aria-label="A+">A+</button>
  <div class="ttl" id="ttl"></div>
  <button class="ibtn" id="bsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl" id="searchLbl"></span></button>
  <button class="ibtn" id="btoc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl" id="tocLbl"></span></button>
</div>
<div class="stage" id="stage">
  <button class="edge l" id="eNext" aria-label="next">‹</button>
  <div class="book3d" id="book">
    <div class="leaf r"><div class="page" id="pr"></div></div>
    <div class="leaf l"><div class="page" id="pl"></div></div>
  </div>
  <button class="edge r" id="ePrev" aria-label="prev">›</button>
</div>
<div class="rnav" dir="ltr">
  <button class="btn ghost sm" id="bNext"></button>
  <form class="jump" id="jump"><span id="pgLbl"></span><input id="pin" type="number" min="1" inputmode="numeric"><span id="ptot"></span><button class="btn ghost sm" id="goBtn" type="submit"></button></form>
  <button class="btn ghost sm" id="bPrev"></button>
</div>
<div class="scrim hidden" id="scrim"></div>
<aside class="drawer" id="drawer" dir="auto">
  <div class="dh"><div class="tabs"><button class="tab on" data-tab="toc" id="tToc"></button><button class="tab" data-tab="search" id="tSearch"></button></div><button class="ibtn" id="dclose">✕</button></div>
  <div id="paneToc" class="pane" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="dsearch"><input id="tf" type="search" dir="auto"></div>
    <div class="dlist" id="tocList"></div>
  </div>
  <div id="paneSearch" class="pane hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <form class="dsearch" id="bsf"><input id="bq" type="search" dir="rtl" enterkeyhint="search"><button class="btn sm" id="bsgo" type="submit"></button></form>
    <div class="dlist" id="sList"></div>
  </div>
</aside>
<script type="module" src="/assets/reader.js"></script>
</body>
</html>
